<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Cooking – Nouveau mot de passe / New password</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.55 system-ui, sans-serif; max-width: 30rem; margin: 0 auto; padding: 2rem 1.25rem; text-align: center; }
    h1 { font-size: 1.4rem; }
    a.button { display: block; margin: 1rem 0; padding: 0.8rem 1rem; border-radius: 1.5rem; background: #1b5e20; color: #fff; text-decoration: none; font-weight: 600; }
    a.button:focus-visible, a.link:focus-visible { outline: 3px solid #1b5e20; outline-offset: 3px; }
    a.link { display: block; margin: 0.5rem 0; padding: 0.5rem 0; }
    @media (prefers-color-scheme: dark) { a.button:focus-visible, a.link:focus-visible { outline-color: #a5d6a7; } }
  </style>
</head>
<body>
  <main>
    <h1><span lang="fr">Nouveau mot de passe</span> / <span lang="en">New password</span></h1>
    <p id="message" aria-live="polite"><span lang="fr">Ouverture de la page…</span> / <span lang="en">Opening the page…</span></p>

    <div id="actions" hidden>
      <a class="button" id="web" href="#" rel="noopener noreferrer"><span lang="fr">Choisir un nouveau mot de passe</span> / <span lang="en">Choose a new password</span></a>
      <p lang="fr">Si la page ne s’ouvre pas toute seule, utilisez ce bouton.</p>
      <p lang="en">If the page does not open by itself, use this button.</p>
    </div>

    <noscript>
      <p lang="fr">JavaScript est nécessaire pour ouvrir ce lien.</p>
      <p lang="en">JavaScript is required to open this link.</p>
    </noscript>

    <a class="link" href="privacy.html"><span lang="fr">Confidentialité</span> / <span lang="en">Privacy</span></a>
  </main>
  <script>
    (function () {
      // Mail link: https://pmeig.github.io/cooking/reset-password#token=<secret>
      // On Android with the app installed, the App Link opens the app and this page is not shown.
      // Otherwise the page forwards to the web app of the server. The token stays in the fragment: it is read from
      // location.hash only and is never put in a query string or sent in a request by this page.
      var WEB_APP = 'https://pmeig-cooking.duckdns.org:18443/w/reset';

      if (!new URLSearchParams(location.hash.slice(1)).get('token')) {
        // static text only: each language keeps its lang attribute
        document.getElementById('message').innerHTML = '<span lang="fr">Ce lien est incomplet. Un lien de réinitialisation est valable 1 heure : demandez-en un nouveau depuis l’écran de connexion.</span> / <span lang="en">This link is incomplete. A reset link is valid for 1 hour: ask for a new one from the sign-in screen.</span>';
        return;
      }

      document.getElementById('web').href = WEB_APP + location.hash;
      document.getElementById('actions').hidden = false;
      location.replace(WEB_APP + location.hash);
    })();
  </script>
</body>
</html>
